[project]
name = "prod-rag-finance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sujanraisoftware", email = "sujanrai.software@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "flashrank>=0.2.10",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "milvus-lite>=3.2.2",
    "pydantic-settings>=2.16.2",
    "pymilvus>=3.0.2",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
prod-rag-finance = "prod_rag_finance:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
